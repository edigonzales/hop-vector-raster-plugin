name: Build and deploy Biblios handbook

on:
  push:
    branches: [main]
    paths:
      - 'docs/biblios/**'
  pull_request:
    paths:
      - 'docs/biblios/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check documentation workflow and snapshot isolation
        run: python3 -m unittest discover -s docs/biblios/tools -p 'test_*.py'
      - name: Build exact checked-out commit with latest Biblios snapshot
        run: python3 docs/biblios/build.py --revision "$GITHUB_SHA"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/biblios/build/docs-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
