name: Publish Maven release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-publish.yml@3c90ffcc2ad051a5d678e39980230c7711d79742
    with:
      ci-ref: 3c90ffcc2ad051a5d678e39980230c7711d79742
      repository-kind: release
      verified-artifact-name: hop-vector-raster-plugin-canonical
      pom-file: assemblies/assemblies-hop-vector-raster/pom.xml
      artifact-id: hop-vector-raster-plugin
      plugin-root: plugins/transforms/vector-raster
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
