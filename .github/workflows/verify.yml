name: Verify plugin

on:
  workflow_call:

permissions:
  contents: read

jobs:
  geometry-input:
    name: Download published Geometry dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-plugin-ci
          ref: f0a1eec368cb8c5d2592086b26393a6fc3916ad1
          path: .ci/hop-plugin-ci
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download declared Geometry snapshot
        shell: bash
        run: |
          python3 .ci/hop-plugin-ci/scripts/write_maven_settings.py --output "$RUNNER_TEMP/maven-settings.xml"
          version="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").getroot().findtext("{*}properties/{*}hop.geometry.type.version"))')"
          python3 .ci/hop-plugin-ci/scripts/download_maven_artifact.py \
            --group ch.so.agi --artifact hop-geometry-type-plugin --version "$version" \
            --extension zip --maven-settings "$RUNNER_TEMP/maven-settings.xml" \
            --maven-options "-U -B -ntp -Dmaven.repo.local=$RUNNER_TEMP/geometry-download-m2" \
            --output .ci/geometry-dist/hop-geometry-type-plugin.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vector-geometry-dependency
          if-no-files-found: error
          path: .ci/geometry-dist/*.zip

  build:
    needs: geometry-input
    uses: edigonzales/hop-plugin-ci/.github/workflows/verify.yml@f0a1eec368cb8c5d2592086b26393a6fc3916ad1
    with:
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "macos-15", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-working-directory: .
      maven-options: -U -B -ntp
      compatibility-goals: test
      maven-extra-args: -Dhop.geometry.type.version=0.2.0-SNAPSHOT -Dmaven.repo.local=.ci/maven-repository
      dependency-artifact-name: vector-geometry-dependency
      dependency-artifact-path: .ci/dependencies
      maven-goals: clean verify
      pom-file: assemblies/assemblies-hop-vector-raster/pom.xml
      artifact-name-prefix: hop-vector-raster-plugin
      artifacts: >-
        [{"pom":"pom.xml"},
         {"file":"assemblies/assemblies-hop-vector-raster/target/hop-vector-raster-plugin-*.zip","pom":"assemblies/assemblies-hop-vector-raster/pom.xml"}]
      validation-command: |
        python scripts/check-distribution.py
        python scripts/test-raster-migration.py
        sh scripts/run-headless-vector-dialogs.sh
        python3 scripts/verify-published-geometry.py --geometry-zip .ci/dependencies/hop-geometry-type-plugin.zip --maven-repository .ci/maven-repository

  e2e-inputs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-plugin-ci
          ref: f0a1eec368cb8c5d2592086b26393a6fc3916ad1
          path: .ci/hop-plugin-ci
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure common Maven repositories
        run: |
          python3 .ci/hop-plugin-ci/scripts/write_maven_settings.py \
            --output "$RUNNER_TEMP/maven-settings.xml"
      - uses: actions/download-artifact@v4
        with:
          name: vector-geometry-dependency
          path: .ci/geometry-dist
      - name: Download matching Raster Type snapshot
        run: |
          mkdir -p .ci/raster-dist
          python3 .ci/hop-plugin-ci/scripts/download_maven_artifact.py \
            --group ch.so.agi --artifact hop-raster-type-plugin --version 0.1.0-SNAPSHOT \
            --extension zip --maven-settings "$RUNNER_TEMP/maven-settings.xml" \
            --output .ci/raster-dist/hop-raster-type-plugin.zip
      - name: Download isolated Hop 2.19.0
        run: |
          mkdir -p .ci/hop-dist
          if ! curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            https://downloads.apache.org/hop/2.19.0/apache-hop-client-2.19.0.zip -o ".ci/hop-dist/hop.zip"; then
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
              https://archive.apache.org/dist/hop/2.19.0/apache-hop-client-2.19.0.zip -o ".ci/hop-dist/hop.zip"
          fi
          echo "eb227ffe3386480f5ecb59e1d9fdbb16ace15b9ebd9e02da16cdca2c3cadc869f92275b0f607952fb2c5122986839a5b09b2c5762401dad128d8de6b0394643c  .ci/hop-dist/hop.zip" | sha512sum -c -
      - name: Upload shared E2E inputs
        uses: actions/upload-artifact@v4
        with:
          name: vector-raster-e2e-inputs
          compression-level: 0
          path: |
            .ci/hop-dist/hop.zip
            .ci/geometry-dist/hop-geometry-type-plugin.zip
            .ci/raster-dist/hop-raster-type-plugin.zip

  installed-e2e:
    needs: [build, e2e-inputs]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        java: ['21', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: hop-vector-raster-plugin-canonical
          path: .ci/verified
      - uses: actions/download-artifact@v4
        with:
          name: vector-raster-e2e-inputs
          path: .ci/e2e-inputs
      - name: Set up independent FileGDB reader
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gdal-reference
          create-args: >-
            python=3.12
            gdal=3.12
          cache-environment: true
      - name: Configure independent FileGDB check
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        shell: micromamba-shell {0}
        run: echo "GDAL_PREFIX=$CONDA_PREFIX" >> "$GITHUB_ENV"
      - name: Install offline schema validation tools
        run: python -m pip install -r scripts/requirements-test.txt
      - name: Run installed Hop scenarios and runtime identity checks
        shell: bash
        run: |
          python -m zipfile -e .ci/e2e-inputs/hop-dist/hop.zip .ci/e2e-hop
          if [[ "$RUNNER_OS" != Windows ]]; then
            chmod u+x .ci/e2e-hop/hop/hop-run.sh
          fi
          python scripts/run-installed-e2e.py \
            --hop-home .ci/e2e-hop/hop \
            --plugin-zip .ci/verified/hop-vector-raster-plugin-*.zip \
            --geometry-zip .ci/e2e-inputs/geometry-dist/hop-geometry-type-plugin.zip \
            --raster-type-zip .ci/e2e-inputs/raster-dist/hop-raster-type-plugin.zip \
            --work-dir .ci/e2e-results
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-raster-e2e-${{ matrix.os }}-java${{ matrix.java }}
          path: .ci/e2e-results
