<rect x="3" y="10" width="7" height="7" fill="#A8CE94" fill-opacity="0.3575"/>
<rect x="10" y="10" width="7" height="7" fill="#A8CE94" fill-opacity="0.1375"/>
<rect x="17" y="10" width="7" height="7" fill="#A8CE94" fill-opacity="0.308"/>
<rect x="3" y="17" width="7" height="7" fill="#A8CE94" fill-opacity="0.198"/>
<rect x="10" y="17" width="7" height="7" fill="#A8CE94" fill-opacity="0.319"/>
