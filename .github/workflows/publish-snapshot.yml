name: Publish Maven snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-publish.yml@4bf21523ce3662adf9f69a4836504c7ed203db99
    with:
      ci-ref: 4bf21523ce3662adf9f69a4836504c7ed203db99
      repository-kind: snapshot
      verified-artifact-name: hop-vector-raster-plugin-canonical
      pom-file: assemblies/assemblies-hop-vector-raster/pom.xml
      artifact-id: hop-vector-raster-plugin
      plugin-root: plugins/transforms/vector-raster
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
