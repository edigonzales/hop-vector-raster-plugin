name: Verify plugin

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-verify.yml@990af4813013fa8d21f6447e7545ed5499f2f202
    with:
      ci-ref: 990af4813013fa8d21f6447e7545ed5499f2f202
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "macos-15", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-working-directory: .
      maven-options: -U -B -ntp
      compatibility-goals: test
      maven-extra-args: -Dhop.geometry.type.version=0.2.0-SNAPSHOT
      maven-goals: clean verify
      pom-file: assemblies/assemblies-hop-vector-raster/pom.xml
      zip-glob: assemblies/assemblies-hop-vector-raster/target/hop-vector-raster-plugin-*.zip
      validation-commands: '["python scripts/check-distribution.py", "python scripts/check-cloud-output.py"]'
      additional-verified-files: '["pom.xml"]'
      artifact-name-prefix: hop-vector-raster-plugin
      group-id: ch.so.agi
      artifact-id: hop-vector-raster-plugin
      hop-version: 2.19.0
      plugin-root: plugins/transforms/vector-raster

  installed-e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-plugin-ci
          ref: 990af4813013fa8d21f6447e7545ed5499f2f202
          path: .ci/hop-plugin-ci
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure common Maven repositories
        run: |
          python3 .ci/hop-plugin-ci/scripts/write_maven_settings.py \
            --output "$RUNNER_TEMP/maven-settings.xml"
      - uses: actions/download-artifact@v4
        with:
          name: hop-vector-raster-plugin-canonical
          path: .ci/verified
      - name: Download current Geometry snapshot
        run: |
          mkdir -p .ci/geometry-dist
          python3 .ci/hop-plugin-ci/scripts/download_maven_artifact.py \
            --group ch.so.agi \
            --artifact hop-geometry-type-plugin \
            --version 0.2.0-SNAPSHOT \
            --extension zip \
            --maven-settings "$RUNNER_TEMP/maven-settings.xml" \
            --output .ci/geometry-dist/hop-geometry-type-plugin.zip
      - name: Download isolated Hop 2.19.0
        run: |
          if ! curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            https://downloads.apache.org/hop/2.19.0/apache-hop-client-2.19.0.zip -o "$RUNNER_TEMP/hop.zip"; then
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
              https://archive.apache.org/dist/hop/2.19.0/apache-hop-client-2.19.0.zip -o "$RUNNER_TEMP/hop.zip"
          fi
          echo "eb227ffe3386480f5ecb59e1d9fdbb16ace15b9ebd9e02da16cdca2c3cadc869f92275b0f607952fb2c5122986839a5b09b2c5762401dad128d8de6b0394643c  $RUNNER_TEMP/hop.zip" | sha512sum -c -
      - name: Install package into clean Hop and run raster/vector smoke
        run: |
          set -euo pipefail
          unzip -q "$RUNNER_TEMP/hop.zip" -d "$RUNNER_TEMP/hop"
          zip_path="$(find .ci/verified -type f -name 'hop-vector-raster-plugin-*.zip' -print | head -n 1)"
          geometry_zip="$PWD/.ci/geometry-dist/hop-geometry-type-plugin.zip"
          test -n "$zip_path"
          test -n "$geometry_zip"
          python3 scripts/run-installed-e2e.py \
            --hop-home "$RUNNER_TEMP/hop/hop" \
            --plugin-zip "$zip_path" \
            --geometry-zip "$geometry_zip"
