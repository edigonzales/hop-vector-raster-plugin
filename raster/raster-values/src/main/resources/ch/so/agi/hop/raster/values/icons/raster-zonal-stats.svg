<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title id="title">Raster ZonalStats (GeoTools)</title>
  <desc id="desc">Polygonzone über Rasterzellen mit einem Sigma als Kennzeichen für statistische Aggregation. Das Zeichen steht hier für zonale Kennzahlen allgemein, nicht nur für die Summe.</desc>
