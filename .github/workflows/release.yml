name: Publish Maven release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-publish.yml@c5c104571b54c42eb9e7a2c3baaa2f45e27ca450
    with:
      ci-ref: c5c104571b54c42eb9e7a2c3baaa2f45e27ca450
      repository-kind: release
      verified-artifact-name: hop-vector-raster-plugin-canonical
      pom-file: assemblies/assemblies-hop-vector-raster/pom.xml
      artifact-id: hop-vector-raster-plugin
      plugin-root: plugins/transforms/vector-raster
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
