name: Publish Maven release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-publish.yml@661af245b23538192b467758e337216a9f96459e
    with:
      ci-ref: 661af245b23538192b467758e337216a9f96459e
      repository-kind: release
      verified-artifact-name: hop-vector-raster-plugin-ubuntu-latest-jdk17
      pom-file: assemblies/assemblies-hop-vector-raster/pom.xml
      artifact-id: hop-vector-raster-plugin
      plugin-root: plugins/transforms/vector-raster
    secrets:
      MAVEN_USERNAME: ${{ secrets.INTERLIS_MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.INTERLIS_MAVEN_TOKEN }}
